name: build-apk

on:
  push:
    branches: [main]
    paths:
      - "client/android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Fetch tunnel deps (libXray + tun2socks)
        working-directory: client/android
        run: |
          chmod +x fetch-deps.sh
          ./fetch-deps.sh

      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/build.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "### Build failed — last errors:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "^e:|error:|FAILED|Execution failed" /tmp/build.log | tail -40 >> "$GITHUB_STEP_SUMMARY" || tail -40 /tmp/build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "^e:" /tmp/build.log | head -10 | while IFS= read -r line; do echo "::error::${line:0:300}"; done || true
            exit $STATUS
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: freegeo-debug-apk
          path: client/android/app/build/outputs/apk/debug/*.apk

      - name: Build release APK (unsigned)
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: freegeo-release-apk-unsigned
          path: client/android/app/build/outputs/apk/release/*.apk
