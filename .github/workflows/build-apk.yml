name: build-apk

on:
  push:
    branches: [main]
    paths:
      - "client/android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "ndk;27.0.12077973"

      - name: Verify NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          for d in "$ANDROID_HOME/ndk"/*/; do
            if [ -x "${d}ndk-build" ]; then
              echo "NDK found: $d"
              echo "NDK_HOME=$d" >> $GITHUB_ENV
              "${d}ndk-build" --version 2>&1 | head -3
              exit 0
            fi
          done
          echo "::error::NDK not found! ls $ANDROID_HOME/ndk:"
          ls -la "$ANDROID_HOME/ndk/" 2>&1 || true
          exit 1

      - name: Fetch tunnel deps
        working-directory: client/android
        run: |
          chmod +x fetch-deps.sh
          ./fetch-deps.sh

      - name: Verify JNI symbols
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            so="app/src/main/jniLibs/$abi/libhev-socks5-tunnel.so"
            if [ -f "$so" ]; then
              echo "=== $abi ==="
              if strings "$so" 2>/dev/null | grep -q "TProxyStartService"; then
                echo "JNI symbols: OK"
              else
                echo "JNI symbols: MISSING"
                file "$so"
                ls -lh "$so"
              fi
            fi
          done

      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/build.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "### Build failed — last 120 lines:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -120 /tmp/build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit $STATUS
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: freegeo-debug-apk
          path: client/android/app/build/outputs/apk/debug/*.apk
