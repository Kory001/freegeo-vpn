name: build-apk

on:
  push:
    branches: [main]
    paths:
      - "client/android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: ndk;27.0.12077973

      - name: Show NDK location
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          find $ANDROID_HOME/ndk -maxdepth 2 -name ndk-build 2>/dev/null | head -5
          echo "NDK_HOME=$(find $ANDROID_HOME/ndk -maxdepth 1 -type d 2>/dev/null | tail -n +2 | head -1)" >> $GITHUB_ENV

      - name: Fetch tunnel deps (libXray + tun2socks JNI)
        working-directory: client/android
        run: |
          chmod +x fetch-deps.sh
          ./fetch-deps.sh

      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/build.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "### Build failed — last 120 lines:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -120 /tmp/build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit $STATUS
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: freegeo-debug-apk
          path: client/android/app/build/outputs/apk/debug/*.apk
