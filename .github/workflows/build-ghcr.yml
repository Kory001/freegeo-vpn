name: build-ghcr

on:
  push:
    branches: [main]
    paths:
      - "nodes/koyeb/**"
      - ".github/workflows/build-ghcr.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: img
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build
        run: |
          set -o pipefail
          IMAGE="${{ env.REGISTRY }}/${{ steps.img.outputs.name }}"
          if ! docker buildx build \
              --platform linux/amd64 \
              --progress=plain \
              -t "$IMAGE:$GITHUB_SHA_SHORT" -t "$IMAGE:latest" \
              --output type=docker \
              nodes/koyeb 2>&1 | tee /tmp/build.log; then
            echo "### Docker build failed — errors:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "ERROR|error:|exit code|unsupported|not found|404" /tmp/build.log | sort -u | tail -20 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "ERROR|error:|exit code|unsupported" /tmp/build.log | sort -u | tail -8 | while IFS= read -r line; do
              echo "::error::${line:0:200}" || true
            done
            exit 1
          fi
        env:
          GITHUB_SHA_SHORT: ${{ github.sha }}

      - name: Push image
        run: |
          set -o pipefail
          IMAGE="${{ env.REGISTRY }}/${{ steps.img.outputs.name }}"
          if ! docker push "$IMAGE:${GITHUB_SHA::7}" 2>&1 | tee /tmp/push.log && \
             docker push "$IMAGE:latest" 2>&1 | tee -a /tmp/push.log; then
            echo "### Push failed:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -20 /tmp/push.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -iE "denied|error|failed" /tmp/push.log | tail -5 | while IFS= read -r line; do
              echo "::error::${line:0:200}"
            done
            exit 1
          fi
